<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <rect width="1024" height="1536" fill="#FFFFFF"/>

  <!-- 체크무늬: 투명해야 할 영역 표시 -->
  <defs>
    <pattern id="ck" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#F2F0F4"/>
      <rect width="32" height="32" fill="#E4E0E9"/>
      <rect x="32" y="32" width="32" height="32" fill="#E4E0E9"/>
    </pattern>
  </defs>
  <rect width="1024" height="1536" fill="url(#ck)"/>

  <!-- 중심선 -->
  <line x1="512" y1="0" x2="512" y2="1536"
        stroke="#2D7DFF" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="526" y="40" font-family="sans-serif" font-size="34"
        fill="#2D7DFF" font-weight="700">중심선 512</text>

  <!-- 기준 가로선 -->
  <line x1="0" y1="210" x2="1024" y2="210" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="18" y="196" font-family="sans-serif" font-size="34" fill="#FF2D78" font-weight="700">정수리 210</text>
  <line x1="0" y1="400" x2="1024" y2="400" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="18" y="386" font-family="sans-serif" font-size="34" fill="#FF2D78" font-weight="700">눈높이 400</text>
  <line x1="0" y1="530" x2="1024" y2="530" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="18" y="516" font-family="sans-serif" font-size="34" fill="#FF2D78" font-weight="700">턱끝 530</text>
  <line x1="0" y1="640" x2="1024" y2="640" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="18" y="626" font-family="sans-serif" font-size="34" fill="#FF2D78" font-weight="700">어깨 640</text>
  <line x1="0" y1="940" x2="1024" y2="940" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="18" y="926" font-family="sans-serif" font-size="34" fill="#FF2D78" font-weight="700">허리 940</text>
  <line x1="0" y1="1230" x2="1024" y2="1230" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="18" y="1216" font-family="sans-serif" font-size="34" fill="#FF2D78" font-weight="700">무릎 1230</text>
  <line x1="0" y1="1460" x2="1024" y2="1460" stroke="#FF2D78" stroke-width="3" stroke-dasharray="14 10"/>
