  <!-- 실루엣 참고 -->
  <g fill="none" stroke="#1B1620" stroke-width="5" opacity=".5">
    <ellipse cx="512" cy="370"
             rx="150" ry="160"/>
    <path d="M457 530 L457 640
             M567 530 L567 640"/>
    <path d="M322 640 Q512 600 702 640
             L677 940 L347 940 Z"/>
    <path d="M362 940 L382 1230 L392 1460
