# Cloudflare 배포 설정 — Workers + 정적 에셋
#
# Cloudflare가 신규 프로젝트를 Workers로만 만들도록 바꿨다.
# 대시보드에 Pages 생성 옵션이 더 이상 없어서 이 방식으로 간다.
# (그래서 pages_build_output_dir 이 아니라 [assets] 를 쓴다)
#
# 서버에서 도는 코드는 없다. `npm run build` 가 만든 dist/ 를 그대로 서빙한다.
# 정적 파일만 올리는 Worker는 main = "..." 이 필요 없다.
#
# 대시보드에서 맞춰야 하는 것:
#   Build command   : npm run build
#   Deploy command  : npx wrangler deploy
#
# 옵션은 일부러 최소로 뒀다. 배포가 한 번 성공한 뒤에
# 404 처리(not_found_handling) 같은 걸 얹는다.

name = "crush-lab"
compatibility_date = "2026-08-07"

[assets]
directory = "./dist"
