# Cloudflare Pages 설정
#
# 이 프로젝트는 Pages 프로젝트다.
# (배포 로그에 "you have run `wrangler deploy` on a Pages project" 경고가 뜨는 게 근거)
#
# 서버에서 도는 코드는 없다. `npm run build` 가 만든 dist/ 를 그대로 올린다.
# Workers용 [assets] 블록은 여기서 쓰면 안 된다 — Pages는 pages_build_output_dir 을 본다.
#
# 대시보드에서 맞춰야 하는 것 두 가지:
#   Build command   : npm run build
#   Deploy command  : npx wrangler pages deploy dist --project-name=crush-lab
#
# 배포 명령이 `npx wrangler deploy` (pages 빠짐) 로 되어 있으면
# Workers 배포로 동작해서 실패한다.

name = "crush-lab"
compatibility_date = "2026-08-07"
pages_build_output_dir = "dist"
