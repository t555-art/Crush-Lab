# Cloudflare 배포 설정
#
# 이 프로젝트는 Pages가 아니라 "Workers + 정적 에셋" 방식으로 붙어 있다.
# (배포 로그에 `wrangler deploy` 가 찍히면 Worker 프로젝트다)
#
# 서버 코드는 없고 빌드 결과물만 올린다.
# 그래서 main = "..." 이 없고 [assets] 만 있다 — Cloudflare가 dist/ 를 그대로 서빙한다.
#
# 대시보드의 빌드 명령이 `npm run build` 로 잡혀 있어야
# 여기 적힌 dist/ 가 실제로 만들어진다.
#
# 옵션은 일부러 최소로 뒀다. 배포가 한 번 성공한 뒤에
# 404 처리 같은 걸 얹는 게 안전하다.

name = "crush-lab"
compatibility_date = "2026-08-07"

[assets]
directory = "./dist"
