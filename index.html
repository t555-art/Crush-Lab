<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crush Lab — 연애 성향 검사</title>
<meta name="description" content="좋아하는 마음을 유리병에 담아 들여다보는 곳. 100문항으로 알아보는 내 연애 성향과 16개의 크리스탈 친구.">
<meta property="og:title" content="Crush Lab">
<meta property="og:description" content="넌 어떤 크리스탈이야?">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FDF6F8; --ink:#4B1528; --ink2:#8A5570; --ink3:#B0708C;
  --rose:#ED93B1; --rose-d:#D4537E; --rose-l:#F6C9D8; --rose-xl:#FBEAF0;
  --glass:rgba(255,255,255,.45); --glass-h:rgba(255,255,255,.64);
  --line:rgba(237,147,177,.32); --line-s:rgba(237,147,177,.6);
  --r:14px;
  --f-disp:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-serif:'Gowun Batang',serif;
  --f-body:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --crimson:#B3273A; --crimson-l:#F7DCDF; --crimson-xl:#FBEBEC;
  --emerald:#14805F; --emerald-l:#D8F0E6; --emerald-xl:#E9F7F0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body);
  font-size:16px; line-height:1.6; letter-spacing:-.01em;
  min-height:100vh; overflow-x:hidden;
}
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;transition:background .5s ease}
.o1{width:340px;height:340px;background:#F9C6D8;top:-90px;left:-70px}
.o2{width:300px;height:300px;background:#DCD2F2;bottom:-80px;right:-60px}
.o3{width:240px;height:240px;background:#C3E7E1;top:38%;right:-90px;opacity:.35}
body.theme-dog .o1{background:#CDEEDF}
body.theme-dog .o2{background:#BFE8D6}
body.theme-dog .o3{background:#DFF3E9;opacity:.4}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.pstar{position:absolute;opacity:0;animation:tw 5s ease-in-out infinite;color:var(--rose);transition:color .5s ease}
body.theme-dog .pstar{color:#7FCFAE}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}

#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 18px 64px}
.screen{animation:fade .38s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.fairy{display:block}
.float{animation:fl 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

h1{font-family:var(--f-disp);font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
h2{font-family:var(--f-disp);font-size:20px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0 0 10px}
.sub{color:var(--ink2);font-size:14.5px;line-height:1.72}
.muted{color:var(--ink3);font-size:13px}

.card{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:20px;
}
.btn{
  display:block;width:100%;padding:15px;border:0;border-radius:var(--r);cursor:pointer;
  background:var(--rose-d);color:#fff;font-size:16px;font-weight:700;font-family:var(--f-disp);
  letter-spacing:0;transition:transform .15s,background .2s;
}
.btn:hover{background:#C0416C}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line-s);font-weight:500}
.btn.ghost:hover{background:rgba(255,255,255,.5)}

.opt{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;
  padding:14px 15px;border-radius:12px;cursor:pointer;color:var(--ink);
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  font-size:15px;line-height:1.5;transition:transform .16s,background .2s,border-color .2s;
}
.opt .sheen{position:absolute;inset:0;opacity:0;transition:opacity .22s;pointer-events:none;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.9),rgba(255,255,255,0) 62%)}
.opt:hover{background:var(--glass-h);border-color:var(--line-s)}
.opt:hover .sheen{opacity:1}
.opt:active{transform:scale(.985)}
.opt.sel{background:#F6BDD1;border-color:#E08AA9;color:var(--ink);backdrop-filter:none}
.opt.sel .ic{color:#993556}
.opt .ic{flex-shrink:0;color:var(--rose-d)}
.opt.sel .ic{color:#993556}
.opts{display:flex;flex-direction:column;gap:9px}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.track{flex:1;height:7px;background:var(--rose-xl);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--rose);border-radius:99px;transition:width .35s ease}
.count{font-size:13px;color:var(--ink2);min-width:58px;text-align:right;font-variant-numeric:tabular-nums}

.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.qtext{font-family:var(--f-disp);font-weight:400;font-size:17px;line-height:1.62;white-space:pre-line;margin:0}

.chip{display:inline-block;font-family:var(--f-disp);font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--rose-l);color:#993556}

.axis{margin-bottom:14px}
.axrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px}
.axbar{height:8px;background:var(--rose-xl);border-radius:99px;position:relative;overflow:hidden}
.axfill{position:absolute;top:0;bottom:0;background:var(--rose);border-radius:99px;transition:width .6s ease}
.axnote{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.6}

.honest{background:rgba(255,255,255,.55);border-left:3px solid var(--rose-d);border-radius:0;padding:13px 15px;margin-bottom:10px;font-size:14.5px;line-height:1.7}
.pair{display:flex;gap:10px}
.pair>div{flex:1;text-align:center;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;padding:14px 8px}

#card{width:340px;height:340px;background:linear-gradient(160deg,#FDF6F8,#F9DDE7);border-radius:22px;
  padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:26px}#app{padding:16px 14px 56px}}
body.lite .card,body.lite .opt,body.lite .mrow,body.lite .ccard{
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(255,255,255,.55)}
body.lite .opt:hover{background:rgba(255,255,255,.72)}
body.lite .orb{filter:blur(42px)}
/* backdrop-filter 미지원 기기 전용 */
body.noblur .card,body.noblur .opt,body.noblur .mrow,body.noblur .ccard{
  backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.74)}

.restart{background:none;border:0;padding:4px;margin-left:2px;cursor:pointer;color:var(--ink3);
  display:inline-flex;align-items:center;border-radius:8px;transition:color .2s,background .2s}
.restart:hover{color:var(--rose-d);background:var(--rose-xl)}

.beat{padding:2px 0}
.beat.bt{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.bl{margin:0 0 5px;font-size:13px;color:var(--ink3)}
.bq{margin:0;font-size:15.5px;line-height:1.6;font-weight:500}
.bq:before{content:'“';color:var(--rose);margin-right:1px}
.bq:after{content:'”';color:var(--rose);margin-left:1px}

.axrow{align-items:center}
.ib{background:none;border:0;padding:2px 0;font-family:inherit;font-size:13px;color:var(--ink2);
  cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.ib:hover{color:var(--rose-d)}
.ib .i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  border:1px solid currentColor;border-radius:50%;font-size:9px;line-height:1;font-style:italic;opacity:.75}
.pinfo:empty{display:none}
.pi{margin-top:9px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pi b{display:block;font-size:14px;margin-bottom:4px;color:var(--rose-d)}
.pi p{margin:0;font-size:13.5px;line-height:1.68;color:var(--ink2)}

.mrow{display:flex;align-items:flex-start;gap:12px;background:var(--glass);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:9px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mrow .fairy{flex-shrink:0;margin-top:2px}
.mtx{min-width:0}
.mn{margin:0 0 5px;font-size:16px;font-weight:600}
.ms{font-size:13px;font-weight:400;color:var(--rose-d);margin-left:5px}
.md{margin:0;font-size:14px;line-height:1.68;color:var(--ink2)}

.cat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ccard{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:14px;
  padding:14px 12px 12px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ccard.mine{border:2px solid var(--rose-d);background:rgba(255,255,255,.68)}
.badge{position:absolute;top:9px;right:9px;background:var(--rose-d);color:#fff;font-size:11px;
  padding:2px 9px;border-radius:99px}
.cn{font-family:var(--f-disp);margin:6px 0 1px;font-size:16px;font-weight:700}
.cg{margin:0 0 6px;font-size:11.5px;color:var(--ink3)}
.ct{margin:0 0 7px;font-size:12.5px;line-height:1.5;color:var(--rose-d);font-weight:500;min-height:38px}
.cs{margin:0 0 8px;font-size:12.5px;line-height:1.62;color:var(--ink2);text-align:left}
.ccode{font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
@media (max-width:400px){.cat{grid-template-columns:1fr}.ct{min-height:0}}

.pair2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl{margin:0 0 8px;font-size:13px;font-weight:600}
.pl.good{color:#3E8E7E}.pl.bad{color:var(--rose-d)}
.blist{margin:0;padding-left:18px}
.blist li{margin-bottom:7px;font-size:14px;line-height:1.6}
.idealwrap{margin-top:30px;padding-top:6px;border-top:2px dashed var(--line-s)}
@media (max-width:400px){.pair2{grid-template-columns:1fr}}

.mcard{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mtop{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.mtop .fairy{flex-shrink:0}
.mn{font-family:var(--f-disp);margin:0 0 2px;font-size:17px;font-weight:700}
.ms{font-size:13px;font-weight:400;color:var(--rose-d);margin-left:5px}
.mg{margin:0;font-size:12.5px;color:var(--ink3)}
.mh{margin:0 0 11px;font-size:14.5px;line-height:1.7;color:var(--ink)}
.mline{border-left:3px solid var(--line-s);padding:0 0 0 11px;margin-bottom:9px}
.mline.good{border-left-color:#7FBFAF}
.mline.bad{border-left-color:var(--rose-d)}
.mw{margin:0 0 3px;font-size:13.8px;font-weight:600;color:var(--ink)}
.msc{margin:0;font-size:13.5px;line-height:1.68;color:var(--ink2)}
body.lite .mcard{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.noblur .mcard{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.74)}

.tname{font-family:var(--f-serif);font-size:34px;font-weight:700;
  letter-spacing:-.02em;margin:0 0 5px;
  background:linear-gradient(100deg,#D4537E,#B36BC4);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.tmz{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--rose-d);letter-spacing:-.01em}
.ttag{margin:0 0 13px;font-size:14px;color:var(--ink2);line-height:1.6}
.cmz{margin:0 0 5px;font-size:11.5px;font-weight:600;color:var(--rose-d);line-height:1.45;min-height:32px}
@media (max-width:400px){.cmz{min-height:0}}

/* ── 시작 화면 크리스탈 링 ── */
.ring{position:relative;margin:0 auto 6px}
.rline{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.r1{border:1px dashed rgba(237,147,177,.55);animation:spin 46s linear infinite}
.r2{inset:26px;border:1px solid rgba(179,107,196,.25);animation:spin 34s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;pointer-events:none}
.rname{margin:2px 0 0;font-family:var(--f-disp);font-size:14px;letter-spacing:.06em;
  color:var(--ink3);transition:color .25s,transform .25s;white-space:nowrap}
.rname.lit{color:var(--rose-d);transform:scale(1.14);font-weight:700}
.cz{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .3s;filter:saturate(.72) opacity(.78)}
.cz:hover,.cz.on{transform:translate(-50%,-50%) scale(1.42);filter:saturate(1.1) opacity(1)
  drop-shadow(0 3px 10px rgba(212,83,126,.35));z-index:5}
.cz .fairy{display:block}
@media (prefers-reduced-motion:reduce){.r1,.r2{animation:none}}
.dh{font-family:var(--f-disp);margin:0 0 7px;font-size:16px;font-weight:700;color:var(--rose-d);letter-spacing:0}
.deep{padding:20px}
.dp{margin:0;font-size:15px;line-height:1.85;letter-spacing:-.005em}
.dpn{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:9px}
.scard{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:15px 16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.slab{font-family:var(--f-disp);margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--rose-d);
  display:inline-block;background:var(--rose-xl);padding:3px 10px;border-radius:99px}
.stx{margin:0;font-size:14.8px;line-height:1.82}
body.noblur .scard{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.74)}

/* ── Crush Lab 홈 ── */
.athandle{font-family:var(--f-disp);font-size:15px;color:var(--rose-d);opacity:.7;margin:0 0 -4px}
.wordmark{font-family:var(--f-disp);font-size:32px;font-weight:700;margin:2px 0 8px;color:var(--ink)}
.homesub{font-size:14.5px;color:var(--ink2);margin:0 0 26px;line-height:1.6}
.tcard{position:relative;display:flex;align-items:center;gap:13px;padding:16px;border-radius:16px;
  margin-bottom:11px;text-align:left;cursor:pointer;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .16s,border-color .2s}
.tcard:hover{transform:translateY(-2px);border-color:var(--line-s)}
.tcard .tic{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tcard .ttx{flex:1;min-width:0}
.tcard .ttl{font-family:var(--f-disp);font-size:15.5px;font-weight:700;margin:0 0 2px;color:var(--ink)}
.tcard .tbl{font-size:12.5px;color:var(--ink2);margin:0 0 6px;line-height:1.5}
.tcard .tmeta{font-size:11px;color:var(--ink3);letter-spacing:.02em}
.tcard .tarrow{flex-shrink:0;color:var(--rose-d)}
.tcard.soon{cursor:default;opacity:.68}
.tcard.soon:hover{transform:none}
.badge-soon{position:absolute;top:12px;right:14px;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  padding:3px 9px;border-radius:99px;letter-spacing:.02em}
body.noblur .tcard{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.72)}

/* ── 강아지 매칭 ── */
.fgroup{margin-bottom:16px;text-align:left}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.forder{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:50%;background:var(--emerald-l);color:var(--emerald);font-size:11px;font-weight:700}
.fhead b{font-family:var(--f-disp);font-size:14.5px;flex:1}
.fmove{display:flex;gap:4px}
.mv{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 5px;cursor:pointer;color:var(--ink2)}
.mv:hover{background:var(--rose-xl)}
.fchips{display:flex;flex-wrap:wrap;gap:7px}
.fchip{font-family:var(--f-disp);font-size:12.5px;padding:6px 12px;border-radius:99px;
  border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--emerald);border-color:var(--emerald);color:#fff}

.dcard{display:flex;align-items:center;gap:11px;background:var(--glass);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;margin-bottom:9px}
.dchk input{width:18px;height:18px}
.dcard .ttl{font-family:var(--f-disp);font-size:15px;font-weight:700;margin:0 0 2px}
.dcard .tmeta{font-size:11.5px;color:var(--emerald);margin:0 0 4px}
.dcard .tbl{font-size:12.5px;color:var(--ink2);margin:0;line-height:1.5}

.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{font-family:var(--f-disp);padding:8px 6px;font-size:13px;font-weight:700}
.cmp td{padding:9px 6px;border-top:1px solid var(--line);text-align:center}
.cmp td.ck{text-align:left;color:var(--ink3);font-size:12.5px;width:34%}

/* ── 조건 검색: 접기/펴기 + 정보 ── */
.fclick{cursor:pointer}
.fold{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:15px;padding:2px 6px;margin-left:auto}
.fold:hover{color:var(--emerald)}
.finfo:empty{display:none}
.finfolist{margin:8px 0 10px;padding:11px 13px;list-style:none;background:rgba(255,255,255,.6);
  border:1px solid var(--line);border-radius:11px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.finfolist li{margin-bottom:5px}
.finfolist li:last-child{margin-bottom:0}
.finfolist b{color:var(--emerald);font-family:var(--f-disp)}

/* ── 비교 CTA 상단바 ── */
.cmpbar{background:var(--emerald-xl);border:1px solid rgba(20,128,95,.25);border-radius:14px;
  padding:14px 16px;margin-bottom:16px;text-align:left}
.cmplabel{margin:0 0 8px;font-family:var(--f-disp);font-size:13.5px;font-weight:700;color:var(--emerald)}
.cmpchips{display:flex;flex-wrap:wrap;gap:7px}
.cmpchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(20,128,95,.3);
  border-radius:99px;padding:5px 6px 5px 12px;font-size:12.5px;color:var(--emerald)}
.cmpchip button{background:none;border:0;color:var(--emerald);cursor:pointer;font-size:14px;
  width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.cmpchip button:hover{background:var(--emerald-l)}
.betabadge{display:inline-block;font-family:var(--f-disp);font-size:9.5px;font-weight:700;
  background:var(--emerald);color:#fff;padding:2px 7px;border-radius:99px;margin-left:5px;vertical-align:middle}
.dsearch{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.65);font-family:var(--f-body);font-size:14px;margin-bottom:16px;color:var(--ink)}
.dsearch:focus{outline:none;border-color:var(--emerald)}

/* ── 자체 확인창 (native confirm 대체) ── */
.cfOverlay{position:fixed;inset:0;z-index:999;background:rgba(75,21,40,.32);
  display:flex;align-items:center;justify-content:center;padding:20px}
.cfBox{background:#fff;border-radius:16px;padding:22px 20px;max-width:320px;width:100%;
  box-shadow:0 12px 32px rgba(75,21,40,.25)}
.cfBox p{margin:0 0 18px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.cfBtns{display:flex;gap:9px}
.cfBtns .btn,.cfBtns .btn.ghost{width:auto;flex:1;padding:11px;font-size:14px}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:1000;
  background:rgba(75,21,40,.92);color:#fff;font-size:13.5px;line-height:1.5;padding:12px 18px;
  border-radius:99px;max-width:calc(100% - 36px);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .2s ease,transform .2s ease}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 공유받은 결과 화면 ── */
.fromfriend{background:var(--rose-xl);border:1px solid var(--line-s);border-radius:14px;
  padding:13px 15px;margin-bottom:16px;text-align:center}
.fromfriend p{margin:0;font-size:13.5px;line-height:1.6;color:var(--rose-d)}
.ctabox{position:sticky;bottom:12px;margin-top:26px;padding:14px;border-radius:16px;
  background:rgba(255,255,255,.96);border:1px solid var(--line-s);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 28px rgba(75,21,40,.18)}
body.noblur .ctabox{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}
.ctabox p{margin:0 0 10px;text-align:center;font-size:13.5px;color:var(--ink2)}

/* ── 강아지 매칭: 버튼 녹색 + 유리 텍스처 ── */
body.theme-dog .btn{

}
body.theme-dog .btn:hover{ background:rgba(15,110,82,.9); }
body.theme-dog .btn.ghost{

body.theme-dog .cfBox .btn.ghost{ background:rgba(216,240,230,.5); color:var(--emerald); }

body.noblur.theme-dog .btn.ghost{ backdrop-filter:none; -webkit-backdrop-filter:none; background:#E4F5EE; }

const POOL = [].concat(CH1, CH2, CH3, CH4, CH5, CH6, CH7, EXTRA, FRIEND, SELF, SCENE, FUN, MORE, MORE2);

/* 챕터별 출제 목표 — 합 100 */
const QUOTA = { 1:20, 2:18, 3:16, 4:20, 5:12, 6:12, 7:8 };

/* ---------------------------------------------------------
   1. 문항 세트 조립
   자기소개 답변으로 풀을 거르고, 챕터별 할당량만큼 뽑는다.
   분기 문항(need)이 있으면 우선 배치해서 개인화를 보장한다.
   --------------------------------------------------------- */
function matches(q, intro) {
  const n = q.need;
  if (!n) return true;
  if (n.g && n.g !== intro.gender) return false;
  if (n.grade && !n.grade.includes(intro.grade)) return false;
  if (n.school && n.school !== intro.school) return false;
  if (n.exp && !n.exp.includes(intro.exp)) return false;
  if (n.status && !n.status.includes(intro.status)) return false;
  if (n.social && !n.social.includes(intro.social)) return false;
  return true;
}

/* 현재 상태에 해당하는 챕터는 할당량을 늘린다 */
function adjustedQuota(intro) {
  const q = Object.assign({}, QUOTA);
  const boost = { crush:3, some:4, dating:6, broke:7, none:null }[intro.status];
  if (boost) { q[boost] += 4; q[1] -= 2; q[5] -= 2; }
  if (intro.exp === 'none') { q[6] -= 3; q[7] -= 2; q[3] += 3; q[2] += 2; }
  if (intro.grade === '3') { q[6] += 1; q[1] -= 1; }
  return q;
}

function buildSet(intro, seed) {
  const rng = mulberry32(seed || hashIntro(intro));
  const quota = adjustedQuota(intro);
  const avail = POOL.filter(q => matches(q, intro));
  const set = [];

  for (const ch of [1,2,3,4,5,6,7]) {
    const want = Math.max(0, quota[ch] || 0);
    const inCh = avail.filter(q => q.ch === ch);
    // 분기 문항 먼저 (개인화 보장), 그다음 미러 문항, 나머지는 무작위
    const scene = q => /^[vw]-/.test(q.id);
    const tier1 = shuffle(inCh.filter(q => q.need), rng);
    const tier2 = shuffle(inCh.filter(q => !q.need && scene(q)), rng);   // 구체 상황 우선
    const tier3 = shuffle(inCh.filter(q => !q.need && q.mirror), rng);
    const tier4 = shuffle(inCh.filter(q => !q.need && !q.mirror && !scene(q)), rng);
    set.push(...[...tier1, ...tier2, ...tier3, ...tier4].slice(0, want));
  }
  // 미러 문항이 뽑혔으면 짝이 되는 원본도 강제로 포함
  const ids = new Set(set.map(q => q.id));
  for (const q of set.filter(q => q.mirror)) {
    if (!ids.has(q.mirror)) {
      const m = avail.find(x => x.id === q.mirror);
      if (m) { set.push(m); ids.add(m.id); }
    }
  }
  return set.sort((a,b) => a.ch - b.ch);
}

/* ---------------------------------------------------------
   2. 채점 + 정규화
   raw 합만 쓰면 풀 편향이 그대로 결과에 실린다.
   실제 출제된 세트에서 얻을 수 있었던 최대 +값과 최대 -값으로
   각각 나눠서 -1~+1로 환산한다. 세트마다 편향이 자동 상쇄된다.
   --------------------------------------------------------- */
function score(set, answers) {
  const raw  = { sp:0, ex:0, st:0, iv:0 };
  const maxP = { sp:0, ex:0, st:0, iv:0 };
  const maxN = { sp:0, ex:0, st:0, iv:0 };
  const exp  = { sp:0, ex:0, st:0, iv:0 };   // 무작위 응답 시 기댓값 = 판정 기준선
  const sub  = { trigger:{}, turnoff:{}, reply:{}, sns:{}, heal:{}, eyes:{} };
  const r2   = { conf:0, pop:0, peer:0 };
  const e2   = { conf:0, pop:0, peer:0 };
  const p2   = { conf:0, pop:0, peer:0 }, n2 = { conf:0, pop:0, peer:0 };

  set.forEach(q => {
    const pick = q.o[answers[q.id]];
    ['conf','pop','peer'].forEach(k => {
      const vals = q.o.map(o => (o.s2 && o.s2[k]) || 0);
      if (!vals.some(v => v !== 0)) return;
      p2[k] += Math.max(...vals); n2[k] += Math.min(...vals);
      e2[k] += vals.reduce((a,b)=>a+b,0) / vals.length;
      if (pick && pick.s2 && pick.s2[k]) r2[k] += pick.s2[k];
    });
    for (const k of ['sp','ex','st','iv']) {
      const vals = q.o.map(o => (o.s && o.s[k]) || 0);
      maxP[k] += Math.max(...vals);
      maxN[k] += Math.min(...vals);
      exp[k]  += vals.reduce((a,b)=>a+b,0) / vals.length;
      if (pick && pick.s && pick.s[k]) raw[k] += pick.s[k];
    }
    if (pick && pick.k) pick.k.forEach(tag => {
      const [cat, val] = tag.split(':');
      if (sub[cat]) sub[cat][val] = (sub[cat][val] || 0) + 1;
    });
  });

  // 기준선(exp)에서 얼마나 벗어났는지를, 그 방향의 최대 이탈폭으로 나눈다.
  // 세트가 어느 쪽으로 치우쳐 있든 판정선이 자동으로 가운데로 온다.
  const norm = {};
  for (const k of ['sp','ex','st','iv']) {
    const dev = raw[k] - exp[k];
    const room = dev >= 0 ? (maxP[k] - exp[k]) : (exp[k] - maxN[k]);
    norm[k] = room > 0 ? Math.max(-1, Math.min(1, dev / room)) : 0;
  }

  const norm2 = {};
  ['conf','pop','peer'].forEach(k => {
    const dev = r2[k] - e2[k];
    const room = dev >= 0 ? (p2[k] - e2[k]) : (e2[k] - n2[k]);
    norm2[k] = room > 0 ? Math.max(-1, Math.min(1, dev / room)) : 0;
  });

  const code = ['sp','ex','st','iv']
    .map(k => norm[k] >= 0 ? AXES[k].pos : AXES[k].neg).join('');

  return { raw, norm, norm2, code, sub, strength: strengthOf(norm) };
}

/* 축별 확신도 — 0에 가까우면 '경계형'이라고 알려준다 */
function strengthOf(norm) {
  const out = {};
  for (const k in norm) {
    const a = Math.abs(norm[k]);
    out[k] = a < 0.12 ? 'edge' : a < 0.35 ? 'mild' : a < 0.62 ? 'clear' : 'strong';
  }
  return out;
}

/* ---------------------------------------------------------
   3. 모순 감지
   같은 pair 태그를 가진 문항들의 선택지 점수가
   서로 반대 방향이면 잡아낸다.
   --------------------------------------------------------- */
const PAIR_AXIS = {
  'openness':'ex', 'reply-speed':'iv', 'read-anxiety':'iv', 'jealousy':'iv',
  'eyes':'ex', 'sns-open':'ex', 'sns-signal':'ex', 'speed-core':'sp',
  'effort-visible':'iv', 'first-move':'ex', 'trigger-first':'sp',
  'turnoff-main':'iv', 'signal-read':'iv', 'heal-first':'iv',
  'confess-role':'ex', 'easy-turnoff':'iv'
};

function findContradictions(set, answers) {
  const groups = {};
  set.forEach(q => {
    if (!q.pair) return;
    const pick = q.o[answers[q.id]];
    if (!pick) return;
    (groups[q.pair] = groups[q.pair] || []).push({ q, pick });
  });

  const found = [];
  for (const tag in groups) {
    const items = groups[tag];
    if (items.length < 2) continue;
    const axis = PAIR_AXIS[tag] || 'iv';
    const vals = items.map(i => (i.pick.s && i.pick.s[axis]) || 0);
    const hi = Math.max(...vals), lo = Math.min(...vals);
    if (hi >= 2 && lo <= -2) {
      const a = items[vals.indexOf(hi)], b = items[vals.indexOf(lo)];
      found.push({ tag, axis, gap: hi - lo, a, b });
    }
  }
  return found.sort((x,y) => y.gap - x.gap);
}

/* ---------------------------------------------------------
   4. 행동 격차 — 이성친구 vs 좋아하는 사람
   미러 문항 쌍의 선택지 인덱스 차이를 항목별로 계산
   --------------------------------------------------------- */
function mirrorGaps(set, answers) {
  const byId = {}; set.forEach(q => byId[q.id] = q);
  const gaps = [];
  set.filter(q => q.mirror && byId[q.mirror]).forEach(q => {
    const fi = answers[q.id], ci = answers[q.mirror];
    if (fi == null || ci == null) return;
    const f = q.o[fi], c = byId[q.mirror].o[ci];
    // 친구 쪽 ex(직진)와 좋아하는 쪽 ex의 차이 = 굳어지는 정도
    const fe = (f.s && f.s.ex) || 0, ce = (c.s && c.s.ex) || 0;
    gaps.push({ field:q.cf, gap: fe - ce, friend:f.t, crush:c.t });
  });
  const avg = gaps.length ? gaps.reduce((a,g)=>a+g.gap,0) / gaps.length : 0;
  return {
    items: gaps.sort((a,b)=>b.gap-a.gap),
    avg,
    level: avg >= 3 ? 'frozen' : avg >= 1.2 ? 'shy' : avg <= -1 ? 'inverted' : 'steady'
  };
}

/* ---------------------------------------------------------
   5. 궁합
   실제 갈등은 축의 불일치에서 나온다.
   --------------------------------------------------------- */
function compatibility(codeA, codeB) {
  const A = parse(codeA), B = parse(codeB);
  let s = 50, notes = [];

  // 표현: 둘 다 우회면 아무도 안 움직여서 끝난다
  if (A.ex === 'I' && B.ex === 'I') { s -= 18; notes.push('둘 다 먼저 말 안 해서 흐지부지될 확률이 제일 높은 조합'); }
  else if (A.ex !== B.ex) { s += 12; notes.push('한쪽이 움직이면 다른 쪽이 받아주는 구조'); }
  else { s += 4; notes.push('둘 다 직진이라 빠르게 정해진다'); }

  // 속도: 어긋나면 한쪽이 지친다
  if (A.sp !== B.sp) { s -= 10; notes.push('한쪽은 벌써 마음을 정했는데 다른 쪽은 아직 재는 중'); }
  else s += 8;

  // 무대: 만나고 싶은 쪽과 톡이 편한 쪽
  if (A.st !== B.st) { s -= 12; notes.push('한쪽은 만나자고 하고 한쪽은 연락으로 충분하다고 느낌'); }
  else s += 8;

  // 투자: 전형적인 '나만 좋아하는 것 같아'
  if (A.iv === 'A' && B.iv === 'A') { s += 14; notes.push('둘 다 쏟아붓는 타입이라 뜨겁게 간다'); }
  else if (A.iv !== B.iv) { s -= 14; notes.push('한쪽이 더 좋아하는 게 눈에 보이는 관계가 되기 쉬움'); }
  else { s += 2; notes.push('둘 다 조심스러워서 안전하지만 미지근할 수 있음'); }

  return { score: Math.max(5, Math.min(97, s)), notes };
}

function parse(code) {
  return { sp:code[0], ex:code[1], st:code[2], iv:code[3] };
}

/* ---------------------------------------------------------
   유틸
   --------------------------------------------------------- */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function hashIntro(intro) {
  const s = Object.values(intro).join('|');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

  const contras = findContradictions(set, answers);

  // 1) 축 서술
  const axisLines = ['sp','ex','st','iv'].map(k => {
    const pole = r.norm[k] >= 0 ? AXES[k].pos : AXES[k].neg;
    return { axis:k, pole, pct: Math.round(50 + r.norm[k] * 50),
             text: AXIS_TEXT[k][pole][r.strength[k]] };
  });

  // 2) 솔직히 말하면 — 상위 2건
  const honest = contras.slice(0, 2).map(c => {
    const tpl = CONTRA[c.tag] || CONTRA['openness'];
    const line = tpl[Math.abs(hashStr(c.a.pick.t)) % tpl.length];
    return josaFix(line.replace('{a}', trim(c.a.pick.t)).replace('{b}', trim(c.b.pick.t)));
  });
  if (!honest.length) honest.push(noContraLine(r));

  // 3) 피드백 축
  const flavor = [];
  for (const cat of ['trigger','turnoff','reply','sns','heal']) {
    const top = topKey(r.sub[cat]);
    if (top && SUB_TEXT[cat][top]) flavor.push({ cat, key:top, text:SUB_TEXT[cat][top] });
  }

  // 4) 궁합
  const codes = allCodes();
  const compat = codes.filter(c => c !== r.code)
    .map(c => ({ code:c, ...compatibility(r.code, c) }))
    .sort((a,b) => b.score - a.score);

  return {
    code: r.code, norm: r.norm, norm2: r.norm2, strength: r.strength,
    axisLines, honest,
    gap: { ...GAP_TEXT[gaps.level], level: gaps.level, avg: gaps.avg, items: gaps.items },
    flavor,
    best: compat.slice(0, 2),
    worst: compat.slice(-2).reverse(),
    fearEcho: FEAR_ECHO[intro.fear],
    contraCount: contras.length
  };
}

/* 모순이 하나도 없을 때 */
function noContraLine(r) {
  return Math.abs(r.norm.ex) > 0.4

    : '답이 일관돼서 딱히 지적할 게 없었어. 대신 특정 방향으로 세게 기울지도 않아서, 상대에 따라 네 모습이 꽤 달라질 거야.';
}

function allCodes() {
  const out = [];
  for (const a of ['F','S']) for (const b of ['D','I'])
    for (const c of ['O','N']) for (const d of ['A','G']) out.push(a+b+c+d);
  return out;
}
function topKey(obj) {
  const e = Object.entries(obj || {}).sort((a,b) => b[1] - a[1]);
  return e.length ? e[0][0] : null;
}
function trim(t) { return t.replace(/\s*\(.*?\)\s*/g, '').trim(); }

/* ---------------------------------------------------------
   조사 교정
   인용문 뒤에 붙는 조사를 마지막 글자의 받침에 맞춰 고친다.
   "이어짐"랑  →  "이어짐"이랑
   --------------------------------------------------------- */
const JOSA = [
  ['이랑','랑'], ['을','를'], ['은','는'], ['이','가'], ['과','와'], ['으로','로'],
  ['이라고','라고'], ['이라는','라는'], ['이라도','라도'], ['이야','야'], ['이나','나']
];

function hasBatchim(ch) {
  const c = ch.charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return /[0-9a-zA-Z]/.test(ch) ? !/[aeiouAEIOU]/.test(ch) : false;
  return (c - 0xAC00) % 28 !== 0;
}
function isRieul(ch) {
  const c = ch.charCodeAt(0);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 8;
}

function josaFix(str) {
  return str.replace(/"([^"]+)"(이라고|라고|이라는|라는|이라도|라도|이랑|랑|이나|나|이야|야|을|를|은|는|이|가|과|와|으로|로)/g, (m, quoted, j) => {
    const last = quoted.replace(/[.?!,\s]+$/, '').slice(-1);
    const b = hasBatchim(last);
    for (const [withB, noB] of JOSA) {
      if (j === withB || j === noB) {
        if (withB === '으로') return '"' + quoted + '"' + ((b && !isRieul(last)) ? '으로' : '로');
        return '"' + quoted + '"' + (b ? withB : noB);
      }
    }
    return m;
  });
}
function hashStr(s) {
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}

                           smile('M56 103 Q61 106 66 103');
    case 'closed':  return arcUp(45,90) + arcUp(77,90) + blush(100) + smile('M56 101 L66 101');
    case 'flat':    return dot(45,90,3.6) + dot(77,90,3.6) + blush(101) + smile('M55 102 L67 102');
    case 'wink':    return dot(45,90,4) + arcUp(77,90) + blush(100) + smile('M55 101 Q60 105 67 99');
    case 'smug':    return `<path d="M39 90 Q45 94 51 90" fill="none" stroke="${dark}" stroke-width="2.3" stroke-linecap="round"/>` +
                           `<path d="M71 90 Q77 94 83 90" fill="none" stroke="${dark}" stroke-width="2.3" stroke-linecap="round"/>` +
                           blush(101) + smile('M55 101 Q61 105 68 99');
    case 'cry':     return `<path d="M38 84 Q45 80 52 83" fill="none" stroke="${dark}" stroke-width="1.6" stroke-linecap="round"/>` +
                           `<path d="M70 83 Q77 80 84 84" fill="none" stroke="${dark}" stroke-width="1.6" stroke-linecap="round"/>` +
                           dot(45,92,3.8) + dot(77,92,3.8) + blush(102) +
                           smile('M55 105 Q61 101 67 105') +
                           `<path d="M85 97 Q89 104 85 107 Q81 104 85 97 Z" fill="#8FC7E8"/>`;
    default:        return dot(45,90,3.9) + dot(77,90,3.9) + blush(100) + smile('M55 101 Q61 106 67 101');
  }
}

/* ---------------------------------------------------------
   실루엣 부위 — 유형 코드 4글자에서 그대로 파생된다.
   귀=속도(F/S)  날개=표현(D/I)  밑단=무대(N/O)  머리장식=투자(A/G)
   표정·색이 같아도 이 네 부위 조합은 16종이 전부 다르다.
   --------------------------------------------------------- */
function earPart(letter, rim) {
  return letter === 'F'
    ? `<path d="M20 20 L14 6 L27 15 Z" fill="${rim}" opacity=".8"/><path d="M100 20 L106 6 L93 15 Z" fill="${rim}" opacity=".8"/>`
    : `<circle cx="19" cy="15" r="5.5" fill="${rim}" opacity=".7"/><circle cx="101" cy="15" r="5.5" fill="${rim}" opacity=".7"/>`;
}
function wingPart(letter, base) {
  return letter === 'D'
    ? `<path d="M12 55 C2 68 2 90 16 100 C22 87 22 66 12 55 Z" fill="${base}" opacity=".32"/><path d="M108 55 C118 68 118 90 104 100 C98 87 98 66 108 55 Z" fill="${base}" opacity=".32"/>`
    : `<ellipse cx="18" cy="70" rx="14" ry="23" transform="rotate(-22 18 70)" fill="${base}" opacity=".3"/><ellipse cx="102" cy="70" rx="14" ry="23" transform="rotate(22 102 70)" fill="${base}" opacity=".3"/>`;
}
function hemPart(letter, rim) {
  return letter === 'N'
    ? `<path d="M45 118 h6 M55 121 h8 M69 118 h6" stroke="${rim}" stroke-width="2" stroke-linecap="round" opacity=".55"/>`
    : `<path d="M52 116 Q60 126 68 116 Q60 122 52 116 Z" fill="${rim}" opacity=".5"/>`;
}
function accPart(letter, rim) {
  return letter === 'A'
    ? `<path d="M60 5 C57 1 51 3 51 8 C51 12 60 18 60 18 C60 18 69 12 69 8 C69 3 63 1 60 5 Z" fill="${rim}" opacity=".85"/>`
    : `<path d="M60 2 L67 5 L67 12 L60 16 L53 12 L53 5 Z" fill="${rim}" opacity=".8"/>`;
}

/* size = 픽셀 폭. o.code(4글자) 있으면 유형 실루엣, 없으면 가이드 요정(루아) 기본형 */
function fairy(o) {
  const s = o.size || 120;
  const base = o.base || '#F6C9D8', rim = o.rim || '#E890B0', dark = o.dark || '#4B1528';
  const body = 'M60 14 C86 40,104 62,104 78 A44 44 0 1 1 16 78 C16 62 34 40 60 14 Z';
  const code = o.code || null;
  const gem = o.shape ? `<path d="${GEM_SHAPE[o.shape]}" fill="${rim}" opacity=".42" stroke="${dark}" stroke-width=".6"/>` : '';

  const wings = code ? wingPart(code[1], base)
    : `<ellipse cx="18" cy="70" rx="14" ry="24" transform="rotate(-22 18 70)" fill="${base}" opacity=".34"/><ellipse cx="102" cy="70" rx="14" ry="24" transform="rotate(22 102 70)" fill="${base}" opacity=".34"/>`;
  const ears = code ? earPart(code[0], rim)
    : (o.sparks === false ? '' : `<path d="M14 34 L15.4 38 L19 39.4 L15.4 40.8 L14 45 L12.6 40.8 L9 39.4 L12.6 38 Z" fill="${rim}" opacity=".75"/>
     <path d="M108 46 L109 49 L112 50 L109 51 L108 54 L107 51 L104 50 L107 49 Z" fill="${rim}" opacity=".65"/>`);
  const hem = code ? hemPart(code[2], rim) : '';
  const acc = code ? accPart(code[3], rim)
    : (o.crown === false ? '' : `<path d="M60 3 L62 9 L68 11 L62 13 L60 19 L58 13 L52 11 L58 9 Z" fill="${rim}"/>`);

  return `<svg width="${s}" height="${Math.round(s*1.1)}" viewBox="0 0 120 132" class="fairy" aria-hidden="true">
  ${wings}
  <path d="${body}" fill="${base}" opacity=".78"/>
  <ellipse cx="60" cy="40" rx="34" ry="18" fill="${rim}" opacity=".14"/>
  <ellipse cx="66" cy="92" rx="30" ry="14" fill="${dark}" opacity=".1"/>
  <path d="${body}" fill="none" stroke="${rim}" stroke-width="1.6"/>
  <path d="M26 32 A40 40 0 0 1 62 15" fill="none" stroke="${rim}" stroke-width="1.3" opacity=".55"/>
  <ellipse cx="41" cy="56" rx="12" ry="19" transform="rotate(-24 41 56)" fill="#fff" opacity=".6"/>
  <ellipse cx="76" cy="102" rx="15" ry="7" fill="#fff" opacity=".25"/>
  ${gem}${faceSvg(o.face || 'smile', dark, rim)}${acc}${ears}${hem}
</svg>`;
}

/* 챕터별 가이드 요정 표정 */
const CH_FACE = { 1:'smile', 2:'wink', 3:'shy', 4:'sparkle', 5:'smug', 6:'soft', 7:'cry' };
function guide(size, face) {
  return fairy({ size, face: face || 'smile' });
}
function typeFairy(code, size) {
  const t = TYPES[code];
  return fairy({ size, code, base:t.base, rim:t.rim, dark:t.dark, shape:t.shape, face:t.face });
}

function icon(name, size, cls) {
  const g = GLYPH[ICON_MAP[name] || 'dot'] || GLYPH.dot;
  const paths = g.split('|').map(d =>
    '<path d="' + d + '"/>').join('');
  return '<svg class="' + (cls || 'ic') + '" width="' + (size || 20) + '" height="' + (size || 20) +
    '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}

/* ---------- 네 답으로 다시 쓴 연애 ---------- */
const BEAT = [
  { ch:2, lead:'너를 흔드는 건 이런 거야.' },
  { ch:3, lead:'마음이 생기면 너는 이렇게 해.' },
  { ch:4, lead:'썸이 시작되면.' },
  { ch:5, lead:'고백 앞에서는.' },
  { ch:7, lead:'그리고 끝이 오면.' }
];

function storyline(set, answers) {
  const out = [];
  BEAT.forEach(b => {
    const cand = set.filter(q => q.ch === b.ch && answers[q.id] != null);
    if (!cand.length) return;
    let best = null, bs = -1;
    cand.forEach(q => {
      const p = q.o[answers[q.id]];
      const m = Math.max(...['sp','ex','st','iv'].map(k => Math.abs((p.s && p.s[k]) || 0)));
      if (m > bs) { bs = m; best = { q, p }; }
    });
    if (best) out.push({ lead:b.lead, pick:best.p.t, q:best.q.q.split('\n')[0] });
  });
  return out;
}

/* ---------- 궁합 서술 ---------- */
/* 태그가 관형형(~는)이면 "쪽이야", 명사로 끝나면 "이야/야" */
function tagPhrase(tag){
  const last = tag.slice(-1);
  if (/[는은던]/.test(last)) return tag + ' 쪽';
  return tag;
}
function nameSub(n){ return n + (hasBatchim(n.slice(-1)) ? '이' : '가'); }
function nameTop(n){ return n + (hasBatchim(n.slice(-1)) ? '은' : '는'); }

function matchStory(mine, other, good) {
  const A = { sp:mine[0], ex:mine[1], st:mine[2], iv:mine[3] };
  const B = { sp:other[0], ex:other[1], st:other[2], iv:other[3] };
  const T = TYPES[other];
  const head = nameTop(T.name) + ' ' + tagPhrase(T.tag) + josaEnd(tagPhrase(T.tag)) + '.';
  const L = [];

  if (good) {
    if (A.ex !== B.ex) L.push('네가 먼저 못 하는 말을 ' + nameSub(T.name) + ' 대신 꺼내줘');
    else if (A.ex === 'D') L.push('둘 다 할 말은 하는 쪽이라 오해가 안 쌓여');
    else L.push('둘 다 조용한 편이라 서로를 안 재촉해');

    if (A.iv === B.iv && A.iv === 'A') L.push('둘 다 쏟아붓는 쪽이라 온도가 맞아');
    else if (A.iv === B.iv) L.push('둘 다 조심스러워서 서로를 몰아붙이지 않아');
    else L.push('한쪽이 조금 더 쏟긴 하는데 그게 오히려 균형이 돼');

    if (A.sp === B.sp) L.push('마음이 정해지는 속도가 비슷해서 기다리게 만드는 일이 없어');
    else L.push('속도는 달라도 느린 쪽이 브레이크가 돼줘서 크게 어긋나진 않아');

    if (A.st === B.st) L.push('만나는 방식이 같아서 시작 자체가 쉬워');
    return head + ' ' + L.slice(0,3).join('. ') + '.';
  }

  if (A.ex === 'I' && B.ex === 'I') L.push('둘 다 먼저 말을 안 해서 몇 달이 그냥 지나가');
  else if (A.ex !== B.ex) L.push('한쪽만 계속 말하는 구조가 돼서 그쪽이 먼저 지쳐');
  else L.push('둘 다 직진이라 부딪히면 크게 부딪혀');

  if (A.iv !== B.iv) L.push('한쪽이 더 좋아하는 게 눈에 보이는 관계가 되기 쉬워');
  else if (A.iv === 'G') L.push('둘 다 방어적이라 아무도 먼저 다가가지 않아');
  else L.push('둘 다 쏟는 만큼 상처도 같이 커져');

  if (A.sp !== B.sp) L.push('한쪽이 이미 확신했을 때 다른 쪽은 아직 재고 있어');
  else if (A.sp === 'F') L.push('둘 다 빨라서 식는 것도 같이 빨라');
  else L.push('둘 다 느려서 아무 일도 안 일어난 채로 끝나');

  if (A.st !== B.st) L.push('한쪽은 만나자고 하고 한쪽은 연락이면 충분하다고 느껴');
  return head + ' ' + L.slice(0,3).join('. ') + '.';
}
/* 명사 끝 → 이야 / 야, 관형형+쪽 → 이야 */
function josaEnd(str){
  return hasBatchim(str.slice(-1)) ? '이야' : '야';
}

/* =========================================================
   이상형 추정 + 공략법 + 관계 예측

function scoreIdeal(set, answers) {
  const raw = { sp:0, ex:0, st:0, iv:0 };
  const exp = { sp:0, ex:0, st:0, iv:0 };
  const maxP = { sp:0, ex:0, st:0, iv:0 }, maxN = { sp:0, ex:0, st:0, iv:0 };
  const bullets = [];

  set.forEach(q => {
    const pick = q.o[answers[q.id]];
    ['sp','ex','st','iv'].forEach(k => {
      const vals = q.o.map(o => (o.i && o.i[k]) || 0);
      maxP[k] += Math.max(...vals); maxN[k] += Math.min(...vals);
      exp[k] += vals.reduce((a,b)=>a+b,0) / vals.length;
      if (pick && pick.i && pick.i[k]) raw[k] += pick.i[k];
    });
    if (pick && pick.b) bullets.push(pick.b);
  });

  const norm = {};
  ['sp','ex','st','iv'].forEach(k => {
    const dev = raw[k] - exp[k];
    const room = dev >= 0 ? (maxP[k] - exp[k]) : (exp[k] - maxN[k]);
    norm[k] = room > 0 ? Math.max(-1, Math.min(1, dev / room)) : 0;
  });
  const code = ['sp','ex','st','iv'].map(k => norm[k] >= 0 ? AXES[k].pos : AXES[k].neg).join('');
  return { code, norm, bullets };
}

/* ---------- 관계 예측 : 나 × 이상형 ---------- */
function relationProjection(mine, ideal) {
  const A = { sp:mine[0], ex:mine[1], st:mine[2], iv:mine[3] };
  const B = { sp:ideal[0], ex:ideal[1], st:ideal[2], iv:ideal[3] };
  const pros = [], cons = [];

  if (A.ex === 'I' && B.ex === 'I') cons.push('둘 다 먼저 말을 안 해서 시작 자체가 안 될 확률이 제일 커');
  else if (A.ex !== B.ex) pros.push('한쪽이 말을 꺼내면 다른 쪽이 받아주는 구조라 대화가 막히지 않아');
  else pros.push('둘 다 할 말은 하는 편이라 오해가 오래 안 가');

  if (A.st === B.st) pros.push('만나는 방식이 같아서 약속을 잡는 데 스트레스가 없어');
  else cons.push('한쪽은 얼굴을 봐야 풀리고 한쪽은 연락이면 충분해서 서운함이 쌓여');

  if (A.iv === B.iv && A.iv === 'A') { pros.push('둘 다 쏟는 쪽이라 관계가 빠르게 깊어져'); cons.push('대신 싸울 때도 감정이 크게 튀어'); }
  else if (A.iv === B.iv) { pros.push('서로 몰아붙이지 않아서 편해'); cons.push('대신 진도가 안 나가서 흐지부지될 수 있어'); }
  else cons.push('한쪽이 더 좋아하는 게 눈에 보이는 관계가 되기 쉬워');

  if (A.sp === B.sp) pros.push('마음이 정해지는 속도가 비슷해서 기다리게 하는 일이 없어');
  else cons.push('한쪽이 이미 확신했을 때 다른 쪽은 아직 재고 있어');

  return { pros: pros.slice(0,3), cons: cons.slice(0,3) };
}

/* ---------- 이상형 유형이 실제로 존재할 확률 톤 ---------- */
function idealNote(mineCode, idealCode) {
  if (mineCode === idealCode)
    return '재밌는 건, 네가 원하는 사람이 너랑 같은 유형이라는 거야. 자기랑 닮은 사람을 찾고 있다는 뜻인데, 편한 대신 둘 다 같은 지점에서 막힐 수 있어.';
  const same = [0,1,2,3].filter(i => mineCode[i] === idealCode[i]).length;
  if (same >= 3) return '너랑 상당히 비슷한 사람을 원하고 있어. 대화는 잘 통하겠지만, 서로의 약점이 겹친다는 것도 같이 알아둬.';
  if (same <= 1) return '너랑 거의 정반대인 사람을 원하고 있어. 끌리는 이유는 분명한데, 실제로 만나면 조율할 게 많을 거야.';

const AX_NAME = { sp:'속도', ex:'표현', st:'무대', iv:'투자' };

function matchDetail(mine, other) {
  const K = ['sp','ex','st','iv'];
  const idx = { sp:0, ex:1, st:2, iv:3 };
  const rows = K.map(k => {
    const key = mine[idx[k]] + other[idx[k]];
    const d = PAIR[k][key];
    return { axis:k, key, ...d, same: mine[idx[k]] === other[idx[k]] };
  });
  const plus  = rows.filter(r => r.p > 0);
  const minus = rows.filter(r => r.p < 0);
  const flat  = rows.filter(r => r.p === 0);
  const score = compatibility(mine, other).score;

  const nm = a => a.map(r => AX_NAME[r.axis]).join('·');
  let head;
  if (score >= 88)      head = '네 축 중 세 개 이상이 같은 방향이야. ' + (plus.length? nm(plus)+'가 맞아서 ' : '') + '시작도 유지도 쉬운 조합이야.';
  else if (score >= 75) head = nm(plus) + '가 잘 맞아. 대신 ' + (minus.length? nm(minus) : nm(flat)) + '에서 한 번은 부딪혀.';
  else if (score >= 60) head = '맞는 데는 확실히 맞는데 어긋나는 데도 있어. ' + (plus.length? nm(plus)+'는 괜찮고 ' : '') + (minus.length? nm(minus)+'가 문제야.' : '나머지는 애매해.');
  else if (score >= 45) head = '반반이야. ' + (minus.length? nm(minus)+'에서 갈리는데, ' : '') + '서로 알고 조율하면 되는 수준이야.';
  else if (score >= 30) head = nm(minus.length?minus:flat) + '에서 크게 어긋나. 좋아하는 마음만으로는 안 되고 규칙을 정해야 해.';
  else                  head = '이 조합은 특히 어려워. ' + nm(minus.length?minus:flat) + '가 전부 반대라서, 같은 문제로 계속 돌아오게 돼.';

  return { score, head, plus, minus, flat, rows };
}

/* 결과지 출력용 — 좋은 쪽 1장면 + 걸리는 쪽 1장면 */
function matchCard(mine, other) {
  const d = matchDetail(mine, other);
  const good = d.plus[0] || d.flat[0] || d.rows[0];
  const bad  = d.minus[0] || d.flat[0] || d.rows[3];
  return {
    score: d.score, head: d.head,
    good: good && good !== bad ? { why:good.why, sc:good.sc } : null,
    bad:  bad ? { why:bad.why, sc:bad.sc } : null
  };
}

/* 1) 선택 성향 집계 */
function tally(set, answers) {
  const t = { n:0, silent:0, direct:0, guard:0, pour:0, online:0, offline:0,
              fast:0, slow:0, low:0, high:0, alone:0, check:0 };
  set.forEach(q => {
    const p = q.o[answers[q.id]]; if (!p) return;
    t.n++;
    const s = p.s || {}, s2 = p.s2 || {};
    if ((s.ex||0) <= -2) t.silent++;
    if ((s.ex||0) >=  2) t.direct++;
    if ((s.iv||0) <= -2) t.guard++;
    if ((s.iv||0) >=  2) t.pour++;
    if ((s.st||0) <= -2) t.online++;
    if ((s.st||0) >=  2) t.offline++;
    if ((s.sp||0) >=  2) t.fast++;
    if ((s.sp||0) <= -2) t.slow++;
    if ((s2.conf||0) <= -2) t.low++;
    if ((s2.conf||0) >=  2) t.high++;
    if (/혼자|아무한테도|말 안|못 한다|안 한다/.test(p.t)) t.alone++;
    if (/확인|다시 읽|들어가|본다|찾아본/.test(p.t)) t.check++;
  });
  return t;
}

/* 2) 특정 답변 조합에서만 켜지는 규칙 */
function picked(set, answers, id, re) {
  const q = set.find(x => x.id === id); if (!q) return false;
  const p = q.o[answers[id]]; if (!p) return false;
  return re.test(p.t);
}
function pickText(set, answers, id) {
  const q = set.find(x => x.id === id); if (!q) return null;
  const p = q.o[answers[id]]; return p ? p.t : null;
}

function deepRead(set, answers, R) {
  const t = tally(set, answers);
  const stat = [], quote = [];
  RULES.forEach(r => { if (r.test(t, R)) stat.push({ h:r.h, b:r.b(t, R), w: r.w ? r.w(t) : 0 }); });
  QUOTE_RULES.forEach(r => { try { if (r.test(set, answers)) quote.push({ h:r.h, b:r.b(set, answers) }); } catch(e){} });
  stat.sort((a,b) => b.w - a.w);
  // 통계 근거 → 인용 근거 순으로 섞는다
  const out = [];
  for (let i = 0; i < Math.max(stat.length, quote.length); i++) {
    if (stat[i]) out.push(stat[i]);
    if (quote[i]) out.push(quote[i]);
  }
  return { tally:t, findings: out };
}

  else if (t.silent >= 10) parts.push('말을 아끼는 선택을 '+t.silent+'번 했는데, 이건 약점이면서 동시에 능력이야. 남 얘기를 끝까지 듣고 판단을 미룰 줄 아는 사람이 흔하지 않거든. 실제로 주변에서 너한테 고민 상담을 하는 경우가 있었을 거야.');
  if (t.pour >= 12) parts.push('감정을 쏟는 선택이 '+t.pour+'번이었어. 이만큼 줄 수 있는 사람은 생각보다 드물어. 문제는 양이 아니라 방향이라, 받을 준비가 된 사람을 고르는 것만 되면 이게 네 최대 강점이 돼.');
  else if (t.guard >= 10) parts.push('거리를 지키는 선택이 '+t.guard+'번 나왔어. 남한테 부담을 안 준다는 뜻이고, 관계를 오래 끌고 갈 때 이게 의외로 큰 힘이 돼. 네 옆에 있으면 숨이 안 막히거든.');
  if (t.high >= 6) parts.push('자기 평가가 안정적인 쪽 선택이 '+t.high+'번이었어. 거절당해도 회복이 빠르고 매달리지 않는다는 뜻이라, 연애에서 제일 손해를 덜 보는 조건이야.');
  return parts;
}

const K = { sp:0, ex:1, st:2, iv:3 };
function nm(n){ return n + (hasBatchim(n.slice(-1)) ? '은' : '는'); }
function ns(n){ return n + (hasBatchim(n.slice(-1)) ? '이' : '가'); }
function ro(n){ const c=n.slice(-1); return n + (hasBatchim(c) && !isRieul(c) ? '으로' : '로'); }

/* 조합마다 다른 장점 2개 */
function pairPros(a, b) {
  const A = ATOM[a], B = ATOM[b], An = TYPES[a].name, Bn = TYPES[b].name;
  const out = [];
  out.push({
    w: An + '가 주는 방식이 ' + Bn + '한테 그대로 닿아',
    s: nm(An) + ' ' + A.give + '. ' + nm(Bn) + ' ' + B.want + ' 쪽이라, 다른 사람한텐 안 보이던 게 여기선 정확히 전달돼.' });
  if (a[K.ex] !== b[K.ex])
    out.push({ w: '막힐 때 뚫어주는 쪽이 있어',
      s: '싸우면 ' + nm(An) + ' ' + A.fight + '. ' + nm(Bn) + ' ' + B.fight + '. 부딪히는 방식이 서로 달라서, 둘 다 같은 데서 같이 막히진 않아.' });
  else if (a[K.ex] === 'D')
    out.push({ w: '둘 다 덮어두지 않아',
      s: '싸우면 ' + An + '도 ' + A.fight + '. ' + Bn + '도 ' + B.fight + '. 시끄러운 대신 오해가 오래 안 남아.' });
  else
    out.push({ w: '서로를 몰아붙이지 않아',
      s: nm(An) + ' ' + A.fail + ', ' + nm(Bn) + ' ' + B.fail + '. 둘 다 같은 걸 못 해서, 적어도 서로를 다그치진 않아.' });
  if (a[K.sp] === b[K.sp])
    out.push({ w: '속도가 어긋나지 않아',
      s: '마음이 정해지는 시점이 비슷해서, 한쪽이 기다리다 지치는 구간이 거의 없어.' });
  return out;
}

/* 조합마다 다른 단점 2개 */
function pairCons(a, b) {
  const A = ATOM[a], B = ATOM[b], An = TYPES[a].name, Bn = TYPES[b].name;
  const out = [];
  out.push({
    w: An + '가 멈춘 자리에서 ' + Bn + '도 멈춰',
    s: nm(An) + ' ' + A.fail + '. 그럴 때 ' + nm(Bn) + ' ' + B.fear + '. 각자 자기 방식대로 대응하는데 그게 서로한테는 안 닿아서, 벌어진 거리가 그대로 굳어버려.' });
  out.push({
    w: '불안해질 때 서로를 오해해',
    s: nm(An) + ' 불안하면 ' + A.fear + '. ' + nm(Bn) + ' 그걸 ' + B.misread + '로 읽어. 같은 행동을 두고 둘이 완전히 다른 해석을 하는 거지.' });
  if (a[K.st] !== b[K.st])
    out.push({ w: '만나는 방식이 안 맞아',
      s: (a[K.st]==='O' ? An : Bn) + '는 얼굴을 봐야 풀리는데 ' + (a[K.st]==='O' ? Bn : An) + '는 연락이면 충분하다고 느껴. 이게 서운함으로 쌓여.' });
  if (a[K.iv] !== b[K.iv])
    out.push({ w: '쏟는 양이 달라',
      s: (a[K.iv]==='A' ? An : Bn) + '가 훨씬 많이 쏟게 돼. 시간이 지나면 그 차이가 눈에 보이기 시작하고, 먼저 지치는 쪽도 정해져 있어.' });
  return out;
}

/* ---------- 점수 계산 ---------- */
function dogValueIndex(key, d){
  const c = CRIT.find(x=>x.key===key);
  return c.str ? c.opts.indexOf(d[key]) : d[key];
}
function dogScore(d){
  let score=0, active=0, matched=0;
  DS.priority.forEach((key,i)=>{
    const sel = DS.filters[key];
    if(!sel || !sel.length) return;
    active++;
    const w = DS.priority.length - i;
    if(sel.includes(dogValueIndex(key, d))){ score+=w; matched++; }
  });
  return { score, active, matched };
}

/* ---------- 이름 검색: 연속 두 글자(bigram) 겹침 기반 ---------- */
function dogBigrams(s){
  const arr = []; for (let i=0; i<s.length-1; i++) arr.push(s.slice(i,i+2));
  return arr;
}
function dogNameScore(q, name){
  if (name.includes(q)) return 1000 + q.length;
  if (q.length < 2) return name.includes(q) ? 1 : 0;
  let score = 0;
  dogBigrams(q).forEach(bg => { if (name.includes(bg)) score++; });
  return score;
}
function dogMatchList(){
  const q = (DS.catalogQuery||'').trim();
  if(!q) return DOGS.slice();
  const ql = q.toLowerCase();
  return DOGS.map(d=>{
    let score = dogNameScore(q, d.kr); // 한글: 부분일치 + 두 글자 겹침(bigram) 퍼지 매칭
    if (d.en.toLowerCase().includes(ql)) score = Math.max(score, 1000 + ql.length); // 영문: 정확한 부분일치만
    return { d, score };
  }).filter(x=>x.score>0).sort((a,b)=> b.score-a.score || a.d.kr.localeCompare(b.d.kr)).map(x=>x.d);
}
function dogCatalogFilter(v){
  DS.catalogQuery = v;
  dogRenderGrid(); // 입력창 DOM은 절대 건드리지 않는다 (한글 조합 보존)
}
function dogRenderGrid(){
  const box = $('dogCatGrid'); if(!box) return;
  const list = dogMatchList();
  if(!list.length){
    box.innerHTML = '<p class="muted" style="text-align:center;margin-top:20px">일치하는 견종이 없어. 두 글자 정도만 겹쳐도 찾아지니 짧게 써봐.</p>';
    return;
  }
  box.innerHTML = '<div class="cat">'+list.map(d=>
    '<div class="ccard" onclick="renderDogDetail(&#39;'+d.id+'&#39;)" style="cursor:pointer">'+
      '<div style="display:flex;justify-content:center">'+dogIcon(d,64)+'</div>'+
      '<p class="cn">'+esc(d.kr)+'</p><p class="cg">'+d.size+' · '+d.w[0]+'~'+d.w[1]+'kg</p>'+

  ).join('')+'</div>';
}

function seedStars(){
  const w=$('stars'); let h='';
  const small = window.innerWidth < 520;

function wireOpts(onPick){
  document.querySelectorAll('.opt').forEach(o=>{
    o.addEventListener('pointermove',e=>{
      const r=o.getBoundingClientRect();
      o.style.setProperty('--mx',(e.clientX-r.left)+'px');
      o.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
    o.addEventListener('click',()=>{
      if(o.dataset.locked) return;
      const r=o.getBoundingClientRect();
      document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.dataset.locked='1';});
      o.classList.add('sel');
      setTimeout(()=>onPick(+o.dataset.i),300);
    });
  });
}

function wireRing(){
  const items = [...document.querySelectorAll('.cz')];
  const label = $('rname');
  if(!items.length) return;
  const base = 'Crush&nbsp;Lab';
  let timer = null, idx = -1;

  function light(i, keep){
    items.forEach(el=>el.classList.remove('on'));
    if(i<0){ label.innerHTML = base; label.classList.remove('lit'); return; }
    const el = items[i];
    el.classList.add('on');
    label.textContent = el.dataset.en;
    label.classList.add('lit');
  }
  items.forEach((el,i)=>{
    el.addEventListener('mouseenter',()=>{ stop(); light(i); });
    el.addEventListener('mouseleave',()=>{ light(-1); start(); });
    el.addEventListener('click',()=>{ stop(); light(i);
      setTimeout(()=>{ if(label) label.textContent = el.dataset.nm; },400); });
  });
  function step(){ idx = (idx+1)%items.length; light(idx); }
  function start(){ if(timer) return; timer = setInterval(step, 1500); }
  function stop(){ clearInterval(timer); timer = null; }
  // 마우스가 없는 기기에서도 순서대로 하나씩 빛난다
  start();
}

/* =========================================================
   결과 링크 공유
   서버가 없으니 결과를 URL 자체에 담는다.
   담는 건 유형 코드 + 축 4개 퍼센트 + (선택) 이상형 코드뿐.
   개별 문항 답변은 넣지 않는다 — 링크를 받은 사람이
   친구가 뭘 골랐는지까지 알 수 있으면 안 되니까.
   ========================================================= */
const SHARE_V = 1;                 // 페이로드 버전. 형식 바뀌면 올린다.
const SHARE_CODES = allCodes();    // 인덱스 ↔ 코드 매핑 (고정 순서)

function b64u(bytes){
  let s=''; for(const b of bytes) s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(str){
  let s=String(str).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s+='=';
  const bin=atob(s), out=[];
  for(let i=0;i<bin.length;i++) out.push(bin.charCodeAt(i));
  return out;
}

function encodeShare(R, idealCode){
  const ci=SHARE_CODES.indexOf(R.code);
  if(ci<0) return '';
  const b=[SHARE_V, ci];
  ['sp','ex','st','iv'].forEach(k=>{
    const a=R.axisLines.find(x=>x.axis===k);
    b.push(Math.max(0, Math.min(100, Math.round(a ? a.pct : 50))));
  });
  const ii=idealCode ? SHARE_CODES.indexOf(idealCode) : -1;
  b.push(ii>=0 ? ii : 255);
  return b64u(b);
}

function decodeShare(str){
  try{
    const b=unb64u(str);
    if(b.length<6 || b[0]!==SHARE_V) return null;
    const code=SHARE_CODES[b[1]];
    if(!code) return null;
    const pcts=[2,3,4,5].map(i=>{
      const v=b[i];
      return (typeof v==='number' && v>=0 && v<=100) ? v : 50;
    });
    const ideal=(b.length>6 && b[6]<16) ? SHARE_CODES[b[6]] : null;
    return { code, pcts, ideal };
  }catch(e){ return null; }
}

/* 공유 페이로드에서 shareCard·축그래프가 쓰는 최소 R을 만든다 */
function shareStub(d){

  const idealCode = (S.didIdeal && S.idealSet.length) ? scoreIdeal(S.idealSet,S.ideal).code : null;

function toast(msg){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('on'));
  setTimeout(()=>{ el.classList.remove('on'); setTimeout(()=>el.remove(),250); }, 2600);
}

function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  ta.remove();
  return ok;
}

function copyShareLink(){
  if(!window.__R) return;
  const url=shareUrl(window.__R);
  const done=()=>toast('링크를 복사했어. 친구한테 붙여넣기만 하면 돼');
  const fail=()=>customConfirm('복사가 안 됐어. 이 주소를 직접 복사해줘.\n\n'+url, ()=>{});
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, ()=>{ legacyCopy(url) ? done() : fail(); });
  } else {
    legacyCopy(url) ? done() : fail();
  }
}

       '<p class="tmz" style="font-size:13.5px;margin-bottom:5px">'+esc(IT.mz)+'</p>'+
       '<span class="chip">'+d.ideal+'</span></div>';
  }

  h+='<div style="display:flex;justify-content:center;margin:22px 0 0">'+shareCard(R,t)+'</div>';

  h+='<div class="ctabox">'+
     '<p>너는 어떤 크리스탈일까?</p>'+
     '<button class="btn" onclick="renderLoveIntro()">나도 검사해볼래</button>'+
     '<button class="btn ghost" style="margin-top:9px" onclick="renderCatalog()">16개 크리스탈 먼저 구경하기</button>'+
     '</div>';

  h+='</div>';
  app().innerHTML=h; window.scrollTo(0,0);
}

/* ---------- 시작 ---------- */
function liteCheck(){
  // 요즘 폰은 코어 4개여도 유리 효과가 충분히 돌아간다.
  // 아주 낮은 사양에서만 blur 강도를 줄이고, 별·오브는 어떤 경우에도 유지한다.
  const mem = navigator.deviceMemory;
  const cores = navigator.hardwareConcurrency || 8;
  if ((typeof mem === 'number' && mem <= 2) || cores <= 2) document.body.classList.add('lite');
  const ok = (window.CSS && CSS.supports)
    ? (CSS.supports('backdrop-filter','blur(4px)') || CSS.supports('-webkit-backdrop-filter','blur(4px)'))
    : false;
  if(!ok) document.body.classList.add('noblur');
}
window.addEventListener('DOMContentLoaded',()=>{
  liteCheck(); seedStars();
  // ?r=... 로 들어왔으면 친구 결과 화면부터 띄운다. 잘못된 값이면 그냥 홈.
  let shared=null;
  try{
    const p=new URLSearchParams(location.search).get('r');
    if(p) shared=decodeShare(p);
  }catch(e){ shared=null; }
  if(shared) renderSharedResult(shared); else renderHome();
});

</script>
